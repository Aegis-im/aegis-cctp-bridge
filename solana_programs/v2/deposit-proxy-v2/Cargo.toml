[package]
name = "deposit-proxy-v2"
version = "0.1.0"
description = "CCTP v2 burn_for_deposit proxy"
repository = "https://github.com/circlefin/solana-cctp-contracts"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deposit_proxy_v2"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-spl/idl-build", "anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "=0.31.0" }
anchor-spl = "=0.31.0"
solana-security-txt = "=1.1.1"
bincode = "1.3.3"

# CPI targets
message-transmitter-v2 = { path = "../message-transmitter-v2", features = ["no-entrypoint", "cpi"] }
token-messenger-minter-v2 = { path = "../token-messenger-minter-v2", features = ["no-entrypoint", "cpi"] }
