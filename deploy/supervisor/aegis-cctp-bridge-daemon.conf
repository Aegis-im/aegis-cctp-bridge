[program:aegis-cctp-bridge-daemon]
directory=/opt/aegis-cctp-bridge
command=/usr/bin/node /opt/aegis-cctp-bridge/scripts/dist/daemonBridgeV2Proxy.js
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=www-data

; Provide secrets and config via environment (set on server / via deploy script)
environment=ANCHOR_PROVIDER_URL="",SOLANA_KEYPAIR_B64="",REMOTE_EVM_PRIVATE_KEY="",REMOTE_EVM_RPC_URL="",REMOTE_EVM_TOKEN_MESSENGER_ADDRESS="",REMOTE_EVM_MESSAGE_TRANSMITTER_ADDRESS="",REMOTE_TOKEN_HEX="",REMOTE_EVM_ADDRESS="",DEPOSIT_PROXY_V2_VAULT_ID="",DEPOSIT_PROXY_V2_MIN_BRIDGE_AMOUNT="",DEPOSIT_PROXY_V2_POLL_INTERVAL_MS="60000"

stdout_logfile=/var/log/aegis-cctp/daemon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
