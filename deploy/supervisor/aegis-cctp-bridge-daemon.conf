[program:aegis-cctp-bridge-daemon]
directory=/opt/aegis-cctp-bridge
command=/usr/bin/env DOTENV_CONFIG_PATH=/opt/aegis-cctp-bridge/.env /usr/bin/node /opt/aegis-cctp-bridge/daemonBridgeV2Proxy.js
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=www-data

; Load config from .env file in the same directory as daemon
environment=DOTENV_CONFIG_PATH="/opt/aegis-cctp-bridge/.env"

stdout_logfile=/var/log/aegis-cctp/daemon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
