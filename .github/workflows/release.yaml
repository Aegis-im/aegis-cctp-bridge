name: Build and Deploy Production

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scripts deps
        working-directory: scripts
        run: npm ci

      - name: Build daemon
        working-directory: scripts
        run: npm run build-daemon

      - name: Add SSH Key to Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: SSH Known Hosts
        id: ssh-known-hosts
        uses: truemark/ssh-known-hosts-action@v1
        with:
          scan-hosts: ${{ secrets.SSH_DAEMON_HOST }}

      - name: Deploy daemon
        run: |
          ssh ${{ secrets.SSH_DAEMON_USERNAME }}@${{ secrets.SSH_DAEMON_HOST }} "mkdir -p /opt/aegis-cctp-bridge/scripts/dist /var/log/aegis-cctp"
          rsync -arc ./scripts/dist/daemonBridgeV2Proxy.js ${{ secrets.SSH_DAEMON_USERNAME }}@${{ secrets.SSH_DAEMON_HOST }}:/opt/aegis-cctp-bridge/scripts/dist/
          ssh ${{ secrets.SSH_DAEMON_USERNAME }}@${{ secrets.SSH_DAEMON_HOST }} "\
            echo '${{ secrets.DAEMON_ENV_B64 }}' | base64 -d > /opt/aegis-cctp-bridge/scripts/.env && \
            chmod 600 /opt/aegis-cctp-bridge/scripts/.env && \
            /usr/bin/supervisorctl update && /usr/bin/supervisorctl restart aegis-cctp-bridge-daemon \
          "
          echo "Daemon deployment completed."
