name: Build and Deploy Stage

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.31.0
          avm use 0.31.0
          anchor --version

      - name: Build Solana programs
        working-directory: solana_programs/v2
        run: anchor build

      - name: Copy IDL files
        run: |
          mkdir -p scripts/target/idl scripts/v2/../target/idl
          cp solana_programs/v2/target/idl/message_transmitter_v2.json scripts/target/idl/ 2>/dev/null || true
          cp solana_programs/v2/target/idl/token_messenger_minter_v2.json scripts/target/idl/ 2>/dev/null || true
          cp solana_programs/v2/target/idl/message_transmitter_v2.json scripts/v2/../target/idl/ 2>/dev/null || true
          cp solana_programs/v2/target/idl/token_messenger_minter_v2.json scripts/v2/../target/idl/ 2>/dev/null || true
          # Create placeholder files for old IDLs if they don't exist
          if [ ! -f scripts/target/idl/message_transmitter_031.json ]; then
            echo '{"version":"0.1.0","name":"message_transmitter_031","instructions":[]}' > scripts/target/idl/message_transmitter_031.json
          fi
          if [ ! -f scripts/target/idl/token_messenger_minter_031.json ]; then
            echo '{"version":"0.1.0","name":"token_messenger_minter_031","instructions":[]}' > scripts/target/idl/token_messenger_minter_031.json
          fi

      - name: Install scripts deps
        working-directory: scripts
        run: npm ci

      - name: Build daemon
        working-directory: scripts
        run: npm run build-daemon

      - name: Add SSH Key to Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.STAGE_SSH_DEPLOY_KEY }}

      - name: SSH Known Hosts
        id: ssh-known-hosts
        uses: truemark/ssh-known-hosts-action@v1
        with:
          scan-hosts: ${{ secrets.STAGE_SSH_DAEMON_HOST }}

      - name: Deploy daemon
        run: |
          ssh ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }} "mkdir -p /opt/aegis-cctp-bridge/scripts/dist /var/log/aegis-cctp"
          rsync -arc ./scripts/dist/daemonBridgeV2Proxy.js ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }}:/opt/aegis-cctp-bridge/scripts/dist/
          ssh ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }} "\
            if ! grep -q '^REMOTE_EVM_PRIVATE_KEY=' /opt/aegis-cctp-bridge/scripts/.env 2>/dev/null; then \
              echo 'REMOTE_EVM_PRIVATE_KEY=${{ secrets.STAGE_EVM_PRIVATE_KEY }}' >> /opt/aegis-cctp-bridge/scripts/.env; \
            else \
              sed -i 's|^REMOTE_EVM_PRIVATE_KEY=.*|REMOTE_EVM_PRIVATE_KEY=${{ secrets.STAGE_EVM_PRIVATE_KEY }}|' /opt/aegis-cctp-bridge/scripts/.env; \
            fi && \
            echo '${{ secrets.STAGE_SOLANA_PRIVATE_KEY }}' > /opt/aegis-cctp-bridge/scripts/manager.json && \
            chmod 600 /opt/aegis-cctp-bridge/scripts/.env /opt/aegis-cctp-bridge/scripts/manager.json && \
            /usr/bin/supervisorctl update && /usr/bin/supervisorctl restart aegis-cctp-bridge-daemon \
          "
          echo "Daemon deployment completed."
