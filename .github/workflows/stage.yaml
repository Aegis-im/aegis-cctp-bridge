name: Build and Deploy Stage

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install scripts deps
        working-directory: scripts
        run: npm ci

      - name: Build daemon
        working-directory: scripts
        run: npm run build-daemon

      - name: Add SSH Key to Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.STAGE_SSH_DEPLOY_KEY }}

      - name: SSH Known Hosts
        id: ssh-known-hosts
        uses: truemark/ssh-known-hosts-action@v1
        with:
          scan-hosts: ${{ secrets.STAGE_SSH_DAEMON_HOST }}

      - name: Deploy daemon
        run: |
          ssh ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }} "mkdir -p /opt/aegis-cctp-bridge /var/log/aegis-cctp"
          rsync -arc ./scripts/dist/daemonBridgeV2Proxy.js ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }}:/opt/aegis-cctp-bridge/daemonBridgeV2Proxy.js
          rsync -arc ./deploy/supervisor/aegis-cctp-bridge-daemon.conf ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }}:/tmp/aegis-cctp-bridge-daemon.conf
          ssh ${{ secrets.STAGE_SSH_DAEMON_USERNAME }}@${{ secrets.STAGE_SSH_DAEMON_HOST }} "\
            if ! grep -q '^REMOTE_EVM_PRIVATE_KEY=' /opt/aegis-cctp-bridge/.env 2>/dev/null; then \
              echo 'REMOTE_EVM_PRIVATE_KEY=${{ secrets.STAGE_EVM_PRIVATE_KEY }}' >> /opt/aegis-cctp-bridge/.env; \
            else \
              sed -i 's|^REMOTE_EVM_PRIVATE_KEY=.*|REMOTE_EVM_PRIVATE_KEY=${{ secrets.STAGE_EVM_PRIVATE_KEY }}|' /opt/aegis-cctp-bridge/.env; \
            fi && \
            echo '${{ secrets.STAGE_SOLANA_PRIVATE_KEY }}' > /opt/aegis-cctp-bridge/manager.json && \
            chmod 600 /opt/aegis-cctp-bridge/.env /opt/aegis-cctp-bridge/manager.json && \
            sudo mv /tmp/aegis-cctp-bridge-daemon.conf /etc/supervisor/conf.d/aegis-cctp-bridge-daemon.conf && \
            sudo /usr/bin/supervisorctl update && sudo /usr/bin/supervisorctl restart aegis-cctp-bridge-daemon \
          "
          echo "Daemon deployment completed."
